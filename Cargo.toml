[workspace]
resolver = "3"
members = ["crates/bgpaint-core", "crates/bgpaint"]

[workspace.package]
version = "0.8.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/belizariogr/bgpaint"
authors = ["Belizario <belizariogr@gmail.com>"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
bgpaint-core = { path = "crates/bgpaint-core" }
tiny-skia = "0.12"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "ico", "tiff", "webp", "tga", "pnm", "qoi", "hdr", "exr", "dds", "ff", "rayon"] }
resvg = "0.49"
cosmic-text = "0.19"
roxmltree = "0.21"
zip = { version = "9", default-features = false, features = ["deflate"] }
eframe = { version = "0.37", default-features = false, features = ["glow", "wayland", "x11", "default_fonts", "accesskit", "clipboard"] }
egui = "0.37"
rfd = "0.17"
arboard = { version = "3.7", features = ["wayland-data-control"] }
sys-locale = "0.3"
dirs = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pollster = "0.4"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
