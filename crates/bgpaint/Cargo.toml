[package]
name = "bgpaint"
description = "A fast, native-feeling clone of Microsoft Paint for Linux and macOS"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
# Scripted input for automated UI tests (see src/automation.rs).
automation = []

[dependencies]
bgpaint-core.workspace = true
eframe.workspace = true
egui.workspace = true
rfd.workspace = true
arboard.workspace = true
sys-locale.workspace = true
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
pollster.workspace = true

# The global menu bar.
[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21.2", default-features = false }
# Only to turn off winit's default menu (same version as eframe uses).
winit = { version = "0.30.13", default-features = false }
