<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    Finder volume icon, as BGDesk's: White Drive (macOS Tahoe) by cheezton,
    https://macosicons.com/icon/white-drive-macos-tahoe-kfAbSZoEDB
    with the BGPaint app icon (crates/bgpaint/assets/icon.svg, which
    script/generate-macos-dmg-assets puts beside this file before rendering)
    as a 300px badge (373px with the icon's transparent margin, which carries
    its own drop shadow) centered on the disk face at (512,491), like BGDesk's mark.
    The drive pixels stay in white-drive-tahoe.png so the disk is not traced
    from a thumbnail.
  -->
  <image href="white-drive-tahoe.png" xlink:href="white-drive-tahoe.png" width="1024" height="1024"/>
  <image href="icon.svg" xlink:href="icon.svg"
         x="325.5" y="304.5" width="373" height="373"/>
</svg>
